<div class="course-card" 
  [ngClass]="getCardClass(course)"
>

  <div class="course-title">
    {{course.id}} {{course.description}}
  </div>

  @if (course.id == 1) {
    <h2>Free Course!!!</h2>
  }
  @else if (course.iconUrl) {
    <img width="300" alt="Angular Logo" src={{course.iconUrl}}>
  }
  @else {
    <h2>No image available!</h2>
  }

  <!-- <img width="300" alt="Angular Logo" *ngIf="course.iconUrl; else noImage"  
    src={{course.iconUrl}}
  >

  <ng-template #noImage>
    <h2>No image available!</h2>
  </ng-template> -->

  <div class="course-description">
    {{course.longDescription}}
  </div>

  <button (click)="onCourseViewed()">View Course</button>

</div>
